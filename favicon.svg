<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1f14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a120b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#bgGrad)" stroke="rgba(255,215,100,0.3)" stroke-width="1.5"/>
  <text x="50" y="66" font-size="52" text-anchor="middle" fill="#ffd700" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" filter="url(#glow)">СИ</text>
  <text x="50" y="84" font-size="9" text-anchor="middle" fill="rgba(255,215,100,0.5)" font-family="'Inter', system-ui, sans-serif" font-weight="500" letter-spacing="2">ЮРИСТ</text>
</svg>